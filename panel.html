<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel quizu</title>
<style>
  :root{
    --bg:#12151c;
    --surface:#1b2030;
    --surface-2:#242b40;
    --line:#323b54;
    --text:#e9ecf5;
    --text-dim:#9099b5;
    --gold:#e8b84b;
    --teal:#3fa9a0;
    --red:#d9615a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Barlow Condensed','Inter',sans-serif;
    font-weight:700;
    letter-spacing:0.2px;
    margin:0;
  }
  .topbar{
    padding:22px 32px;
    border-bottom:1px solid var(--line);
  }
  .topbar h1{
    font-size:28px;
    color:var(--text);
  }
  .topbar span{color:var(--gold);}
  .layout{
    display:flex;
    min-height:calc(100vh - 76px);
  }
  .left{
    width:60%;
    padding:28px;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .right{
    width:40%;
    padding:28px;
    overflow-y:auto;
  }
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  .panel h2{
    font-size:20px;
    margin-bottom:14px;
    color:var(--text);
  }
  .row{
    display:flex;
    gap:10px;
  }
  input[type=text], input[type=number], select{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    width:100%;
    font-family:inherit;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--teal);
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    transition:opacity .15s ease;
  }
  button:hover{opacity:0.85;}
  .btn-primary{background:var(--teal);color:#0c1a18;}
  .btn-gold{background:var(--gold);color:#241a04;}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:6px 10px;
    font-size:13px;
  }
  .btn-danger-ghost{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
    padding:6px 10px;
    font-size:13px;
  }
  .cat-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
  }
  .cat-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 8px 6px 14px;
    font-size:13px;
  }
  .cat-chip .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
  }
  .cat-chip button{
    padding:2px 6px;
    font-size:12px;
    border-radius:6px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .media-input{
    border:1px dashed var(--line);
    border-radius:8px;
    padding:14px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
  }
  .media-input:hover{border-color:var(--teal);}
  .media-tag{
    display:inline-block;
    margin-top:8px;
    background:var(--surface-2);
    border-radius:6px;
    padding:4px 8px;
    font-size:12px;
    color:var(--gold);
  }
  .form-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .cat-group{
    margin-bottom:22px;
  }
  .cat-group-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .cat-group-header .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--gold);
  }
  .cat-group-header h3{
    font-size:18px;
    flex:1;
  }
  .cat-group-header .count{
    font-size:12px;
    color:var(--text-dim);
  }
  .q-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .q-points{
    background:var(--gold);
    color:#241a04;
    font-weight:700;
    font-size:13px;
    border-radius:6px;
    padding:4px 8px;
    min-width:32px;
    text-align:center;
    flex-shrink:0;
  }
  .q-body{flex:1;min-width:0;}
  .q-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .q-meta{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .q-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .empty-state{
    color:var(--text-dim);
    font-size:14px;
    text-align:center;
    padding:40px 10px;
    border:1px dashed var(--line);
    border-radius:8px;
  }
  .editing-banner{
    background:rgba(232,184,75,0.12);
    border:1px solid var(--gold);
    color:var(--gold);
    font-size:13px;
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .editing-banner button{
    background:none;
    border:none;
    color:var(--gold);
    text-decoration:underline;
    padding:0;
    font-size:13px;
  }
  .answers-box{margin-bottom:14px;}
  .answers-box > label{display:block;font-size:13px;color:var(--text-dim);margin-bottom:6px;}
  .answer-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .answer-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--gold);flex-shrink:0;cursor:pointer;}
  .answer-hint{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .q-answers{margin-top:6px;font-size:12px;color:var(--text-dim);}
  .q-answers .ok{color:var(--gold);font-weight:600;}
  .json-bar{display:flex;gap:10px;margin-bottom:16px;}
  .sync-status{font-size:12px;color:var(--text-dim);margin-bottom:8px;min-height:16px;}
  .sync-status.err{color:var(--red);}
  .json-preview{
    width:100%;min-height:180px;background:var(--bg);color:var(--text-dim);
    border:1px solid var(--line);border-radius:8px;padding:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;resize:vertical;
  }
  @media (max-width: 860px){
    .layout{flex-direction:column;}
    .left, .right{width:100%;border-right:none;}
    .field-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Panel <span>quizu</span></h1>
</div>

<div class="layout">

  <div class="left">

    <div class="panel">
      <h2>Kategorie</h2>
      <div class="row">
        <input type="text" id="catInput" placeholder="Nazwa kategorii, np. Historia">
        <button class="btn-primary" onclick="addCategory()">Dodaj</button>
      </div>
      <div class="cat-list" id="catList"></div>
    </div>

    <div class="panel">
      <div id="editBanner"></div>
      <h2 id="formTitle">Nowe pytanie</h2>

      <div class="field">
        <label for="qName">Treść pytania</label>
        <input type="text" id="qName" placeholder="Np. W którym roku wybuchła II wojna światowa?">
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="qCategory">Kategoria</label>
          <select id="qCategory"></select>
        </div>
        <div class="field">
          <label for="qType">Typ pytania</label>
          <select id="qType">
            <option value="jednokrotny">Jednokrotnego wyboru</option>
            <option value="pixelated">Pixelated</option>
            <option value="muzyczne">Muzyczne</option>
          </select>
        </div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="qPoints">Punkty za pytanie</label>
          <input type="number" id="qPoints" placeholder="np. 10" min="0">
        </div>
        <div class="field">
          <label>Multimedia (zdjęcie / muzyka)</label>
          <div class="media-input" onclick="document.getElementById('qMedia').click()">
            📎 Kliknij, aby wybrać plik
          </div>
          <input type="file" id="qMedia" accept="image/*,audio/*" style="display:none" onchange="handleMediaChange(this)">
          <div id="mediaTag"></div>
        </div>
      </div>

      <div class="answers-box" id="answersBox">
        <label>Odpowiedzi (zaznacz poprawną)</label>
        <div id="answerRows"></div>
        <div class="answer-hint" id="answerHint"></div>
      </div>

      <div class="form-actions">
        <button class="btn-gold" onclick="saveQuestion()" id="saveBtn">Dodaj pytanie</button>
      </div>
    </div>

  </div>

  <div class="right">
    <h2 style="margin-bottom:16px;">Lista pytań</h2>
    <div id="questionList"></div>

    <h2 style="margin:28px 0 12px;">Dane (JSON)</h2>
    <div class="json-bar">
      <button class="btn-primary" onclick="downloadJson()">Pobierz JSON</button>
      <button class="btn-ghost" onclick="document.getElementById('jsonFile').click()">Wczytaj JSON</button>
      <input type="file" id="jsonFile" accept="application/json,.json" style="display:none" onchange="handleJsonFile(this)">
    </div>
    <div class="sync-status" id="syncStatus"></div>
    <textarea class="json-preview" id="jsonPreview" readonly></textarea>
  </div>

</div>

<script>
let categories = [];
let questions = [];
let categoryIdCounter = 1;
let questionIdCounter = 1;
let editingQuestionId = null;
const ANSWER_COUNT = 4;
const UPLOAD_URL = '/files'; // ENDPOINT DO WYSYŁANIA PLIKÓW
const DATA_URL = '/data';    // ENDPOINT GET (pobranie) i POST (zapis) CAŁEGO JSON-a
let pendingMediaFile = null;

const typeLabels = {
  'jednokrotny': 'Jednokrotnego wyboru',
  'pixelated': 'Pixelated',
  'muzyczne': 'Muzyczne'
};

function addCategory(){
  const input = document.getElementById('catInput');
  const name = input.value.trim();
  if(!name) return;
  categories.push({ id: categoryIdCounter++, name });
  input.value = '';
  renderCategories();
  renderCategorySelect();
  renderQuestions();
  syncData();
}

function renameCategory(id){
  const cat = categories.find(c => c.id === id);
  if(!cat) return;
  const newName = prompt('Nowa nazwa kategorii:', cat.name);
  if(newName && newName.trim()){
    cat.name = newName.trim();
    renderCategories();
    renderCategorySelect();
    renderQuestions();
    syncData();
  }
}

function deleteCategory(id){
  const used = questions.some(q => q.categoryId === id);
  if(used && !confirm('Ta kategoria ma przypisane pytania. Usunięcie kategorii usunie też te pytania. Kontynuować?')) return;
  categories = categories.filter(c => c.id !== id);
  questions = questions.filter(q => q.categoryId !== id);
  renderCategories();
  renderCategorySelect();
  renderQuestions();
  syncData();
}

function renderCategories(){
  const list = document.getElementById('catList');
  if(categories.length === 0){
    list.innerHTML = '<span style="color:var(--text-dim);font-size:13px;">Brak kategorii — dodaj pierwszą powyżej.</span>';
    return;
  }
  list.innerHTML = categories.map(c => `
    <div class="cat-chip">
      <span class="dot"></span>
      <span>${escapeHtml(c.name)}</span>
      <button class="btn-ghost" onclick="renameCategory(${c.id})">Edytuj</button>
      <button class="btn-danger-ghost" onclick="deleteCategory(${c.id})">Usuń</button>
    </div>
  `).join('');
}

function renderCategorySelect(){
  const select = document.getElementById('qCategory');
  const current = select.value;
  if(categories.length === 0){
    select.innerHTML = '<option value="">Najpierw dodaj kategorię</option>';
    return;
  }
  select.innerHTML = categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  if(categories.some(c => String(c.id) === current)) select.value = current;
}

function handleMediaChange(input){
  const file = input.files[0];
  pendingMediaFile = file || null;
  document.getElementById('mediaTag').innerHTML = file
    ? `<span class="media-tag">🎵🖼 ${escapeHtml(file.name)}</span>`
    : '';
}

async function saveQuestion(){
  const name = document.getElementById('qName').value.trim();
  const categoryId = Number(document.getElementById('qCategory').value);
  const type = document.getElementById('qType').value;
  const points = Number(document.getElementById('qPoints').value) || 0;

  if(!name){ alert('Podaj treść pytania.'); return; }
  if(!categoryId){ alert('Wybierz lub dodaj najpierw kategorię.'); return; }

  const answers = readAnswers();
  if(hasAnswers(type)){
    const filled = answers.filter(a => a.text);
    if(filled.length < 2){ alert('Wpisz co najmniej 2 odpowiedzi.'); return; }
    if(!filled.some(a => a.correct)){ alert('Zaznacz co najmniej jedną poprawną odpowiedź.'); return; }
  }

  let uploadedName = null;
  if(pendingMediaFile){
    const saveBtn = document.getElementById('saveBtn');
    const oldLabel = saveBtn.textContent;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Wysyłanie pliku...';
    try {
      uploadedName = await uploadFile(pendingMediaFile);
    } catch(e){
      alert('Nie udało się wysłać pliku na serwer: ' + e.message);
      saveBtn.disabled = false;
      saveBtn.textContent = oldLabel;
      return;
    }
    saveBtn.disabled = false;
    saveBtn.textContent = oldLabel;
  }

  if(editingQuestionId){
    const q = questions.find(q => q.id === editingQuestionId);
    q.name = name;
    q.categoryId = categoryId;
    q.type = type;
    q.points = points;
    q.answers = hasAnswers(type) ? answers : [];  // played zostaje bez zmian przy edycji
    if(uploadedName) q.media = uploadedName;
    cancelEdit();
  } else {
    questions.push({
      id: questionIdCounter++,
      name, categoryId, type, points,
      answers: hasAnswers(type) ? answers : [],
      media: uploadedName,
      played: false
    });
    resetForm();
  }
  renderQuestions();
  syncData();
}

function resetForm(){
  document.getElementById('qName').value = '';
  document.getElementById('qPoints').value = '';
  document.getElementById('qMedia').value = '';
  document.getElementById('mediaTag').innerHTML = '';
  pendingMediaFile = null;
  renderAnswerRows();
}

function editQuestion(id){
  const q = questions.find(q => q.id === id);
  if(!q) return;
  editingQuestionId = id;
  document.getElementById('qName').value = q.name;
  document.getElementById('qCategory').value = q.categoryId;
  document.getElementById('qType').value = q.type;
  document.getElementById('qPoints').value = q.points;
  renderAnswerRows(q.answers);
  pendingMediaFile = null;
  document.getElementById('qMedia').value = '';
  document.getElementById('mediaTag').innerHTML = q.media
    ? `<span class="media-tag">Obecny plik: ${escapeHtml(q.media)}</span>` : '';
  document.getElementById('formTitle').textContent = 'Edytuj pytanie';
  document.getElementById('saveBtn').textContent = 'Zapisz zmiany';
  renderEditBanner();
  document.getElementById('qName').scrollIntoView({behavior:'smooth', block:'center'});
}

function cancelEdit(){
  editingQuestionId = null;
  document.getElementById('formTitle').textContent = 'Nowe pytanie';
  document.getElementById('saveBtn').textContent = 'Dodaj pytanie';
  document.getElementById('editBanner').innerHTML = '';
  resetForm();
}

function renderEditBanner(){
  document.getElementById('editBanner').innerHTML = `
    <div class="editing-banner">
      <span>Edytujesz istniejące pytanie</span>
      <button onclick="cancelEdit()">Anuluj</button>
    </div>`;
}

function deleteQuestion(id){
  if(!confirm('Usunąć to pytanie?')) return;
  questions = questions.filter(q => q.id !== id);
  if(editingQuestionId === id) cancelEdit();
  renderQuestions();
  syncData();
}

function renderQuestions(){
  const container = document.getElementById('questionList');
  if(categories.length === 0){
    container.innerHTML = '<div class="empty-state">Dodaj kategorię i pytanie, aby zobaczyć tu listę.</div>';
    updateJsonPreview();
    return;
  }

  let html = '';
  categories.forEach(cat => {
    const catQuestions = questions
      .filter(q => q.categoryId === cat.id)
      .sort((a, b) => b.points - a.points);

    if(catQuestions.length === 0) return;

    html += `
      <div class="cat-group">
        <div class="cat-group-header">
          <span class="dot"></span>
          <h3>${escapeHtml(cat.name)}</h3>
          <span class="count">${catQuestions.length} pyt.</span>
        </div>
        ${catQuestions.map(q => `
          <div class="q-card">
            <div class="q-points">${q.points}</div>
            <div class="q-body">
              <div class="q-name">${escapeHtml(q.name)}</div>
              <div class="q-meta">
                <span>${typeLabels[q.type] || q.type}</span>
                ${q.media ? `<span>📎 ${escapeHtml(q.media)}</span>` : ''}
              </div>
              ${(q.answers && q.answers.length) ? `<div class="q-answers">${q.answers.filter(a => a.text).map(a => a.correct ? `<span class="ok">✓ ${escapeHtml(a.text)}</span>` : escapeHtml(a.text)).join(' &nbsp;|&nbsp; ')}</div>` : ''}
            </div>
            <div class="q-actions">
              <button class="btn-ghost" onclick="editQuestion(${q.id})">Edytuj</button>
              <button class="btn-danger-ghost" onclick="deleteQuestion(${q.id})">Usuń</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  });

  container.innerHTML = html || '<div class="empty-state">Brak pytań — dodaj pierwsze w formularzu po lewej.</div>';
  updateJsonPreview();
}

// ---------- WYSYŁANIE PLIKÓW ----------
function randomFileName(originalName){
  const dot = originalName.lastIndexOf('.');
  const ext = dot > -1 ? originalName.slice(dot).toLowerCase() : '';
  const id = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2));
  return id + ext;
}

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1]); // sam base64, bez prefiksu data:
    reader.onerror = () => reject(new Error('Nie można odczytać pliku'));
    reader.readAsDataURL(file);
  });
}

// Wysyła plik POST-em na UPLOAD_URL jako JSON: { "name": "<losowa-nazwa>", "value": "<base64>" }
async function uploadFile(file){
  const name = randomFileName(file.name);
  const value = await fileToBase64(file);
  const res = await fetch(UPLOAD_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, value })
  });
  if(!res.ok) throw new Error('serwer zwrócił ' + res.status);
  return name;
}

// ---------- ODPOWIEDZI ----------
function hasAnswers(type){
  return ['jednokrotny', 'pixelated', 'muzyczne'].includes(type);
}

function renderAnswerRows(answers){
  const rows = document.getElementById('answerRows');
  const type = document.getElementById('qType').value;
  const box = document.getElementById('answersBox');
  box.style.display = hasAnswers(type) ? 'block' : 'none';
  document.getElementById('answerHint').textContent =
    'Tylko jedna odpowiedź może być poprawna.';
  let html = '';
  for(let i = 0; i < ANSWER_COUNT; i++){
    const a = (answers && answers[i]) || {text:'', correct:false};
    html += `
      <div class="answer-row">
        <input type="checkbox" class="ans-correct" ${a.correct ? 'checked' : ''} onchange="onCorrectChange(${i})" title="Poprawna odpowiedź">
        <input type="text" class="ans-text" placeholder="Odpowiedź ${i + 1}" value="${escapeHtml(a.text).replace(/"/g,'&quot;')}">
      </div>`;
  }
  rows.innerHTML = html;
}

function onCorrectChange(index){
  const boxes = document.querySelectorAll('.ans-correct');
  boxes.forEach((b, i) => { if(i !== index) b.checked = false; });
}

function readAnswers(){
  const texts = document.querySelectorAll('.ans-text');
  const checks = document.querySelectorAll('.ans-correct');
  const out = [];
  texts.forEach((t, i) => out.push({ text: t.value.trim(), correct: checks[i].checked }));
  return out;
}

document.getElementById('qType').addEventListener('change', () => {
  const current = readAnswers();
  let seen = false;
  current.forEach(a => { if(a.correct){ if(seen) a.correct = false; seen = true; } });
  renderAnswerRows(current);
});

// ---------- JSON ----------
// Struktura: tablica kategorii, każda z tablicą swoich pytań.
function getPanelData(){
  return categories.map(cat => ({
    id: cat.id,
    name: cat.name,
    questions: questions
      .filter(q => q.categoryId === cat.id)
      .sort((a, b) => b.points - a.points)
      .map(q => ({
        id: q.id,
        name: q.name,
        type: q.type,
        points: q.points,
        media: q.media || null,
        played: !!q.played,
        answers: q.answers || []
      }))
  }));
}

function setSyncStatus(text, isError){
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  el.className = 'sync-status' + (isError ? ' err' : '');
}

// GET /data - pobiera JSON z pytaniami i przekazuje go do loadData()
async function fetchData(){
  try {
    const res = await fetch(DATA_URL);
    if(!res.ok) throw new Error('serwer zwrócił ' + res.status);
    const data = await res.json();
    loadData(data);
    setSyncStatus('Dane pobrane z serwera.', false);
  } catch(e){
    console.error('Błąd pobierania danych:', e);
    setSyncStatus('Nie udało się pobrać danych z serwera (' + e.message + ').', true);
  }
}

// POST /data - wysyła cały JSON (wszystkie kategorie z pytaniami)
async function syncData(){
  try {
    const res = await fetch(DATA_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(getPanelData())
    });
    if(!res.ok) throw new Error('serwer zwrócił ' + res.status);
    setSyncStatus('Zapisano na serwerze.', false);
  } catch(e){
    console.error('Błąd zapisu danych:', e);
    setSyncStatus('Nie udało się zapisać na serwerze (' + e.message + ').', true);
  }
}

function updateJsonPreview(){
  document.getElementById('jsonPreview').value = JSON.stringify(getPanelData(), null, 2);
}

function downloadJson(){
  const blob = new Blob([JSON.stringify(getPanelData(), null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'quiz.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function handleJsonFile(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { loadData(JSON.parse(reader.result)); }
    catch(e){ alert('Nieprawidłowy plik JSON.'); }
  };
  reader.readAsText(file);
  input.value = '';
}

// Wczytuje JSON (tablica kategorii z pytaniami) do panelu.
// Nie wywołuje syncData(), żeby nie odsyłać na serwer tego, co dopiero z niego przyszło.
function loadData(data){
  if(!Array.isArray(data)) throw new Error('Oczekiwano tablicy kategorii');

  const newCategories = [];
  const newQuestions = [];
  const usedCatIds = new Set();
  const usedQIds = new Set();
  let nextCatId = 1;
  let nextQId = 1;

  data.forEach(cat => {
    let catId = Number(cat.id);
    if(!catId || usedCatIds.has(catId)){
      while(usedCatIds.has(nextCatId)) nextCatId++;
      catId = nextCatId;
    }
    usedCatIds.add(catId);
    newCategories.push({ id: catId, name: String(cat.name || 'Bez nazwy') });

    (cat.questions || []).forEach(q => {
      let qId = Number(q.id);
      if(!qId || usedQIds.has(qId)){
        while(usedQIds.has(nextQId)) nextQId++;
        qId = nextQId;
      }
      usedQIds.add(qId);
      newQuestions.push({
        id: qId,
        name: String(q.name || ''),
        categoryId: catId,
        type: q.type || 'jednokrotny',
        points: Number(q.points) || 0,
        media: q.media || null,
        played: !!q.played,
        answers: Array.isArray(q.answers) ? q.answers.map(a => ({ text: String(a.text || ''), correct: !!a.correct })) : []
      });
    });
  });

  categories = newCategories;
  questions = newQuestions;
  categoryIdCounter = Math.max(0, ...usedCatIds) + 1;
  questionIdCounter = Math.max(0, ...usedQIds) + 1;

  cancelEdit();
  renderCategories();
  renderCategorySelect();
  renderQuestions();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
