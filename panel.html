<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel quizu</title>
<style>
  :root{
    --bg:#12151c;
    --surface:#1b2030;
    --surface-2:#242b40;
    --line:#323b54;
    --text:#e9ecf5;
    --text-dim:#9099b5;
    --gold:#e8b84b;
    --teal:#3fa9a0;
    --red:#d9615a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3{
    font-family:'Barlow Condensed','Inter',sans-serif;
    font-weight:700;
    letter-spacing:0.2px;
    margin:0;
  }
  .topbar{
    padding:22px 32px;
    border-bottom:1px solid var(--line);
  }
  .topbar h1{
    font-size:28px;
    color:var(--text);
  }
  .topbar span{color:var(--gold);}
  .layout{
    display:flex;
    min-height:calc(100vh - 76px);
  }
  .left{
    width:60%;
    padding:28px;
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .right{
    width:40%;
    padding:28px;
    overflow-y:auto;
  }
  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
  }
  .panel h2{
    font-size:20px;
    margin-bottom:14px;
    color:var(--text);
  }
  .row{
    display:flex;
    gap:10px;
  }
  input[type=text], input[type=number], select{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:8px;
    font-size:14px;
    width:100%;
    font-family:inherit;
  }
  input:focus, select:focus{
    outline:none;
    border-color:var(--teal);
  }
  button{
    cursor:pointer;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-size:14px;
    font-weight:600;
    font-family:inherit;
    transition:opacity .15s ease;
  }
  button:hover{opacity:0.85;}
  .btn-primary{background:var(--teal);color:#0c1a18;}
  .btn-gold{background:var(--gold);color:#241a04;}
  .btn-ghost{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text-dim);
    padding:6px 10px;
    font-size:13px;
  }
  .btn-danger-ghost{
    background:transparent;
    border:1px solid var(--red);
    color:var(--red);
    padding:6px 10px;
    font-size:13px;
  }
  .cat-list{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
  }
  .cat-chip{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:20px;
    padding:6px 8px 6px 14px;
    font-size:13px;
  }
  .cat-chip .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold);
  }
  .cat-chip button{
    padding:2px 6px;
    font-size:12px;
    border-radius:6px;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:13px;
    color:var(--text-dim);
    margin-bottom:6px;
  }
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .media-input{
    border:1px dashed var(--line);
    border-radius:8px;
    padding:14px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
  }
  .media-input:hover{border-color:var(--teal);}
  .media-tag{
    display:inline-block;
    margin-top:8px;
    background:var(--surface-2);
    border-radius:6px;
    padding:4px 8px;
    font-size:12px;
    color:var(--gold);
  }
  .form-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .cat-group{
    margin-bottom:22px;
  }
  .cat-group-header{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
    padding-bottom:8px;
    border-bottom:1px solid var(--line);
  }
  .cat-group-header .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--gold);
  }
  .cat-group-header h3{
    font-size:18px;
    flex:1;
  }
  .cat-group-header .count{
    font-size:12px;
    color:var(--text-dim);
  }
  .q-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .q-points{
    background:var(--gold);
    color:#241a04;
    font-weight:700;
    font-size:13px;
    border-radius:6px;
    padding:4px 8px;
    min-width:32px;
    text-align:center;
    flex-shrink:0;
  }
  .q-body{flex:1;min-width:0;}
  .q-name{
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .q-meta{
    font-size:12px;
    color:var(--text-dim);
    margin-top:2px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .q-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .empty-state{
    color:var(--text-dim);
    font-size:14px;
    text-align:center;
    padding:40px 10px;
    border:1px dashed var(--line);
    border-radius:8px;
  }
  .editing-banner{
    background:rgba(232,184,75,0.12);
    border:1px solid var(--gold);
    color:var(--gold);
    font-size:13px;
    padding:8px 12px;
    border-radius:8px;
    margin-bottom:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .editing-banner button{
    background:none;
    border:none;
    color:var(--gold);
    text-decoration:underline;
    padding:0;
    font-size:13px;
  }
  @media (max-width: 860px){
    .layout{flex-direction:column;}
    .left, .right{width:100%;border-right:none;}
    .field-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Panel <span>quizu</span></h1>
</div>

<div class="layout">

  <div class="left">

    <div class="panel">
      <h2>Kategorie</h2>
      <div class="row">
        <input type="text" id="catInput" placeholder="Nazwa kategorii, np. Historia">
        <button class="btn-primary" onclick="addCategory()">Dodaj</button>
      </div>
      <div class="cat-list" id="catList"></div>
    </div>

    <div class="panel">
      <div id="editBanner"></div>
      <h2 id="formTitle">Nowe pytanie</h2>

      <div class="field">
        <label for="qName">Treść pytania</label>
        <input type="text" id="qName" placeholder="Np. W którym roku wybuchła II wojna światowa?">
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="qCategory">Kategoria</label>
          <select id="qCategory"></select>
        </div>
        <div class="field">
          <label for="qType">Typ pytania</label>
          <select id="qType">
            <option value="jednokrotny">Jednokrotnego wyboru</option>
            <option value="wielokrotny">Wielokrotnego wyboru</option>
            <option value="otwarte">Otwarte</option>
            <option value="prawda-falsz">Prawda / fałsz</option>
          </select>
        </div>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="qPoints">Punkty za pytanie</label>
          <input type="number" id="qPoints" placeholder="np. 10" min="0">
        </div>
        <div class="field">
          <label>Multimedia (zdjęcie / muzyka)</label>
          <div class="media-input" onclick="document.getElementById('qMedia').click()">
            📎 Kliknij, aby wybrać plik
          </div>
          <input type="file" id="qMedia" accept="image/*,audio/*" style="display:none" onchange="handleMediaChange(this)">
          <div id="mediaTag"></div>
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-gold" onclick="saveQuestion()" id="saveBtn">Dodaj pytanie</button>
      </div>
    </div>

  </div>

  <div class="right">
    <h2 style="margin-bottom:16px;">Lista pytań</h2>
    <div id="questionList"></div>
  </div>

</div>

<script>
let categories = [];
let questions = [];
let categoryIdCounter = 1;
let questionIdCounter = 1;
let editingQuestionId = null;
let pendingMediaName = null;

const typeLabels = {
  'jednokrotny': 'Jednokrotnego wyboru',
  'wielokrotny': 'Wielokrotnego wyboru',
  'otwarte': 'Otwarte',
  'prawda-falsz': 'Prawda / fałsz'
};

function addCategory(){
  const input = document.getElementById('catInput');
  const name = input.value.trim();
  if(!name) return;
  categories.push({ id: categoryIdCounter++, name });
  input.value = '';
  renderCategories();
  renderCategorySelect();
  renderQuestions();
}

function renameCategory(id){
  const cat = categories.find(c => c.id === id);
  if(!cat) return;
  const newName = prompt('Nowa nazwa kategorii:', cat.name);
  if(newName && newName.trim()){
    cat.name = newName.trim();
    renderCategories();
    renderCategorySelect();
    renderQuestions();
  }
}

function deleteCategory(id){
  const used = questions.some(q => q.categoryId === id);
  if(used && !confirm('Ta kategoria ma przypisane pytania. Usunięcie kategorii usunie też te pytania. Kontynuować?')) return;
  categories = categories.filter(c => c.id !== id);
  questions = questions.filter(q => q.categoryId !== id);
  renderCategories();
  renderCategorySelect();
  renderQuestions();
}

function renderCategories(){
  const list = document.getElementById('catList');
  if(categories.length === 0){
    list.innerHTML = '<span style="color:var(--text-dim);font-size:13px;">Brak kategorii — dodaj pierwszą powyżej.</span>';
    return;
  }
  list.innerHTML = categories.map(c => `
    <div class="cat-chip">
      <span class="dot"></span>
      <span>${escapeHtml(c.name)}</span>
      <button class="btn-ghost" onclick="renameCategory(${c.id})">Edytuj</button>
      <button class="btn-danger-ghost" onclick="deleteCategory(${c.id})">Usuń</button>
    </div>
  `).join('');
}

function renderCategorySelect(){
  const select = document.getElementById('qCategory');
  const current = select.value;
  if(categories.length === 0){
    select.innerHTML = '<option value="">Najpierw dodaj kategorię</option>';
    return;
  }
  select.innerHTML = categories.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  if(categories.some(c => String(c.id) === current)) select.value = current;
}

function handleMediaChange(input){
  const file = input.files[0];
  pendingMediaName = file ? file.name : null;
  document.getElementById('mediaTag').innerHTML = pendingMediaName
    ? `<span class="media-tag">🎵🖼 ${escapeHtml(pendingMediaName)}</span>`
    : '';
}

function saveQuestion(){
  const name = document.getElementById('qName').value.trim();
  const categoryId = Number(document.getElementById('qCategory').value);
  const type = document.getElementById('qType').value;
  const points = Number(document.getElementById('qPoints').value) || 0;

  if(!name){ alert('Podaj treść pytania.'); return; }
  if(!categoryId){ alert('Wybierz lub dodaj najpierw kategorię.'); return; }

  if(editingQuestionId){
    const q = questions.find(q => q.id === editingQuestionId);
    q.name = name;
    q.categoryId = categoryId;
    q.type = type;
    q.points = points;
    if(pendingMediaName) q.media = pendingMediaName;
    cancelEdit();
  } else {
    questions.push({
      id: questionIdCounter++,
      name, categoryId, type, points,
      media: pendingMediaName
    });
    resetForm();
  }
  renderQuestions();
}

function resetForm(){
  document.getElementById('qName').value = '';
  document.getElementById('qPoints').value = '';
  document.getElementById('qMedia').value = '';
  document.getElementById('mediaTag').innerHTML = '';
  pendingMediaName = null;
}

function editQuestion(id){
  const q = questions.find(q => q.id === id);
  if(!q) return;
  editingQuestionId = id;
  document.getElementById('qName').value = q.name;
  document.getElementById('qCategory').value = q.categoryId;
  document.getElementById('qType').value = q.type;
  document.getElementById('qPoints').value = q.points;
  pendingMediaName = null;
  document.getElementById('mediaTag').innerHTML = q.media
    ? `<span class="media-tag">Obecny plik: ${escapeHtml(q.media)}</span>` : '';
  document.getElementById('formTitle').textContent = 'Edytuj pytanie';
  document.getElementById('saveBtn').textContent = 'Zapisz zmiany';
  renderEditBanner();
  document.getElementById('qName').scrollIntoView({behavior:'smooth', block:'center'});
}

function cancelEdit(){
  editingQuestionId = null;
  document.getElementById('formTitle').textContent = 'Nowe pytanie';
  document.getElementById('saveBtn').textContent = 'Dodaj pytanie';
  document.getElementById('editBanner').innerHTML = '';
  resetForm();
}

function renderEditBanner(){
  document.getElementById('editBanner').innerHTML = `
    <div class="editing-banner">
      <span>Edytujesz istniejące pytanie</span>
      <button onclick="cancelEdit()">Anuluj</button>
    </div>`;
}

function deleteQuestion(id){
  if(!confirm('Usunąć to pytanie?')) return;
  questions = questions.filter(q => q.id !== id);
  if(editingQuestionId === id) cancelEdit();
  renderQuestions();
}

function renderQuestions(){
  const container = document.getElementById('questionList');
  if(categories.length === 0){
    container.innerHTML = '<div class="empty-state">Dodaj kategorię i pytanie, aby zobaczyć tu listę.</div>';
    return;
  }

  let html = '';
  categories.forEach(cat => {
    const catQuestions = questions
      .filter(q => q.categoryId === cat.id)
      .sort((a, b) => b.points - a.points);

    if(catQuestions.length === 0) return;

    html += `
      <div class="cat-group">
        <div class="cat-group-header">
          <span class="dot"></span>
          <h3>${escapeHtml(cat.name)}</h3>
          <span class="count">${catQuestions.length} pyt.</span>
        </div>
        ${catQuestions.map(q => `
          <div class="q-card">
            <div class="q-points">${q.points}</div>
            <div class="q-body">
              <div class="q-name">${escapeHtml(q.name)}</div>
              <div class="q-meta">
                <span>${typeLabels[q.type] || q.type}</span>
                ${q.media ? `<span>📎 ${escapeHtml(q.media)}</span>` : ''}
              </div>
            </div>
            <div class="q-actions">
              <button class="btn-ghost" onclick="editQuestion(${q.id})">Edytuj</button>
              <button class="btn-danger-ghost" onclick="deleteQuestion(${q.id})">Usuń</button>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  });

  container.innerHTML = html || '<div class="empty-state">Brak pytań — dodaj pierwsze w formularzu po lewej.</div>';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('catInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') addCategory();
});

renderCategories();
renderCategorySelect();
renderQuestions();
</script>

</body>
</html>
