<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>board</title>
    <link rel="stylesheet" href="./bootstrap.min.css" />
    <link rel="stylesheet" href="./main.css" />
    <style>
        body{
            background-color: var(--secondary-color);
            font-family: happy;
            font-size: 1.5rem;
            color: var(--accent-color);
            height: 100vh;
        }
        .podium{
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        .image{
            height: 90px;
            width: 90px;
            border-radius: 100%;
            border: solid var(--secondary-color) 3px;
            background-color: black;
        }
        .step > .image{
            position:relative;
            margin-bottom: -40px;
            z-index: 222;
            margin-left: 50%;
            left: -45px;
        }
        .box{
            width: 200px;
            background-color: var(--main-color);
            border: solid var(--accent-color) 3px;
            border-radius: 11px;
            padding-top: 50px;
            text-align: center;
            height: calc(100% - 50px);
        }
        .second{
            margin-top: 30px;
        }
        .third{
            margin-top: 50px;
        }
        .container{
            padding-top: 40px;
        }
        .capsule{
            background-color: var(--main-color);
            border: solid var(--accent-color) 3px;
            display: flex;
            gap: 30px;
            align-items: center;
            border-radius: 100px;
            height: 89px;
            margin-top: 20px;
        }
        .capsule > p{
            margin: 0px;
        }
        .capsule > .image{
            margin-left: -3px;
        }
        .image{
            background-position: center;
            background-size: cover;
        }
    </style>
    
</head>
<body>
    <div class="container">
        <div class="podium">
            <div class="step second">
                <div class="image"></div>
                <div class="box">
                    <p class="name">Patrycja</p>
                    <p class="points">2500</p>
                </div>
            </div>
            <div class="step first">
                <div class="image"></div>
                <div class="box">
                    <p class="name">Czarek</p>
                    <p class="points">2500</p>
                </div>
            </div>
            <div class="step third">
                <div class="image"></div>
                <div class="box">
                    <p class="name">Ania</p>
                    <p class="points">2500</p>
                </div>
            </div>
        </div>

        <br/>

        <div class="row" id="otherPlayers">

            <!-- <div class="col-4">
                <div class="capsule">
                    <div class="image"></div>
                    <p>Patryk</p>
                    <p>300</p>
                </div>
            </div> -->

        </div>
    </div>

    <script src="./bootstrap.min.js"></script>
    <script src="./socketIO.min.js"></script>
    <script>
        const socket = io();
        let sortedPlayers;

        socket.emit('getAllPlayers');

        socket.on('allPlayers', (players)=>{
            sortedPlayers = players.sort((a, b) => b.points - a.points);
            populateLeader(sortedPlayers)
        })

        function populateLeader(players){
            let otherPlayers = ``;
            for(let i=0; i<players.length; i++){
                if(i==0){
                    document.querySelector('.first>.box>.name').innerHTML = players[i].name;
                    document.querySelector('.first>.box>.points').innerHTML = players[i].points;
                    document.querySelector('.first>.image').style.backgroundImage = `url('./${players[i].image}')`;
                }
                if(i==1){
                    document.querySelector('.second>.box>.name').innerHTML = players[i].name;
                    document.querySelector('.second>.box>.points').innerHTML = players[i].points;
                    document.querySelector('.second>.image').style.backgroundImage = `url('./${players[i].image}')`;
                }
                if(i==2){
                    document.querySelector('.third>.box>.name').innerHTML = players[i].name;
                    document.querySelector('.third>.box>.points').innerHTML = players[i].points;
                    document.querySelector('.third>.image').style.backgroundImage = `url('./${players[i].image}')`;
                }else if(i>2){
                    otherPlayers += `<div class="col-4">
                                        <div class="capsule">
                                            <div class="image" style="background-image: url('./${players[i].image}')"></div>
                                            <p>${players[i].name}</p>
                                            <p>${players[i].points}</p>
                                        </div>
                                    </div>`
                }
                document.querySelector('#otherPlayers').innerHTML = otherPlayers
                
            }
        }
    </script>
</body>
</html>
