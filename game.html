<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gra</title>
    <link rel="stylesheet" href="./bootstrap.min.css" />
    <link rel="stylesheet" href="./main.css" />
    <style>
        body{
            background-color: var(--secondary-color);
            font-size: 1.5rem;
            color: var(--accent-color);
            height: 100vh;
            font-family: main;
            color: var(--main-color);
            font-size: 2rem;
            text-align: center;
            text-transform: uppercase;
        }
        .questionsPoint{
            background-color: var(--main-color);
            border: solid var(--accent-color) 3px;
            margin-top: 20px;
            color: var(--accent-color);
            height: 100px;
            line-height: 100px;
            border-radius: 50px;
        }
        .main{
            padding: 50px;
        }
        .full{
            position: absolute;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            
        }
    </style>
    
</head>
<body>
    <div class="main" id="game">
        <div class="row" id="categories">
            <div class="col"><p>Gry</p></div>
            <div class="col"><p>Internet</p></div>
            <div class="col"><p>Znajomi</p></div>
            <div class="col"><p>Technologia</p></div>
            <div class="col"><p>Podlasie</p></div>
            <div class="col"><p>Czarek</p></div>
        </div>
        <div class="row" id="questions">
            <div class="col"><div class="questionsPoint">100</div></div>
            <div class="col"><div class="questionsPoint">100</div></div>
            <div class="col"><div class="questionsPoint">100</div></div>
            <div class="col"><div class="questionsPoint">100</div></div>
            <div class="col"><div class="questionsPoint">100</div></div>
            <div class="col"><div class="questionsPoint">100</div></div>
        </div>
    </div> 

    <audio src="./music/milionere.m4a" id="milionere"></audio>
    <audio src="./music/wisniewskiMusic.mp4" id="wisniewskiMusic"></audio>
    <audio src="./music/menAtWork.mp3" id="menAtWork"></audio>
    <audio src="./music/katyPerry.mp3" id="HotnCold"></audio>
    <audio src="./music/hideway.mp3" id="hideway"></audio>
    <audio src="./music/beautifulGirls.mp3" id="beautifulGirls"></audio>
    <audio src="./music/dontLooAtMe.mp3" id="dontLooAtMe"></audio>
    <audio src="./music/makumba.mp3" id="makumba"></audio>


    <iframe src="http://localhost:8080/board" class="full hide" id="board"></iframe>
    <iframe src="http://localhost:8080/question" class="full hide" id="question"></iframe>
    <button onclick="musicPlay()" id="buttonMusic">play</button>
    <script src="./bootstrap.min.js"></script>
    <script src="./socketIO.min.js"></script>
    <script src="./main.js"></script>
    <script>
        const socket = io();
        const milionere = document.querySelector('#milionere');
        const wisniewskiMusic = document.querySelector('#wisniewskiMusic');
        const menAtWork = document.querySelector('#menAtWork');
        const HotnCold = document.querySelector('#HotnCold');
        const hideway = document.querySelector('#hideway');
        const beautifulGirls = document.querySelector('#beautifulGirls');
        const dontLooAtMe = document.querySelector('#dontLooAtMe');
        const makumba = document.querySelector('#makumba');


        let currentMusic;

        function musicPlay(){
            document.querySelector('#buttonMusic').classList.add('hide')
            milionere.play()
            milionere.pause()
        }

        socket.on('updateRawData', (data)=>{
            populateQuestions(data)
        })

        socket.on('playMusic', (musicName)=>{
            if(currentMusic){
                currentMusic.pause();
            }
            if('makumba' == musicName){
                makumba.currentTime = 0;
                makumba.play();
                currentMusic = makumba;
            }
            if('dontLooAtMe' == musicName){
                dontLooAtMe.currentTime = 0;
                dontLooAtMe.play();
                currentMusic = dontLooAtMe;
            }
            if('beautifulGirls' == musicName){
                beautifulGirls.currentTime = 0;
                beautifulGirls.play();
                currentMusic = beautifulGirls;
            }
            if('hideway' == musicName){
                hideway.currentTime = 0;
                hideway.play();
                currentMusic = hideway;
            }
            if('milionere' == musicName){
                milionere.currentTime = 0;
                milionere.play();
                currentMusic = milionere;
            }
            if('wisniewskiMusic' == musicName){
                wisniewskiMusic.currentTime = 0;
                wisniewskiMusic.play();
                currentMusic = wisniewskiMusic;
            }
            if('menAtWork' == musicName){
                menAtWork.currentTime = 0;
                menAtWork.play();
                currentMusic = menAtWork;
            }
            if('HotnCold' == musicName){
                HotnCold.currentTime = 0;
                HotnCold.play();
                currentMusic = HotnCold;
            }
        });

        socket.on('stopMusic', ()=>{
            if(currentMusic){
                currentMusic.pause();
            }
        })

        socket.on('showSection', (section)=>{
            let game = document.querySelector('#game');
            let board = document.querySelector('#board');
            let question = document.querySelector('#question');
            game.classList.add('hide');
            board.classList.add('hide');
            question.classList.add('hide');

            if(section == 'game') game.classList.remove('hide');
            if(section == 'board') board.classList.remove('hide');
            if(section == 'question') question.classList.remove('hide');
        });

        function populateQuestions(data){
            let categories = document.querySelector('#categories');
            let main = document.querySelector('#questions')
            let categoriesHTML = '';
            let questionsHTML = '';

            for(let set of data){
                categoriesHTML += `<div class="col"><p>${set.name}</p></div>`;
                questionsHTML += '<div class="col">';
                for(let question of set.questions){
                    questionsHTML += `<div class="questionsPoint ${question.played ? 'hide' : ''}">${question.points}</div>`
                }
                questionsHTML += '</div>';
            }
            categories.innerHTML = categoriesHTML;
            main.innerHTML = questionsHTML;

        }

        

        (async ()=>{
            populateQuestions(await loadData())
        })()
    </script>
</body>
</html>
